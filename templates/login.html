<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Login - Expense Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center">
    <div class="card bg-white shadow-sm p-8 w-96 border border-slate-100">
        <h2 class="text-2xl font-bold text-slate-800 mb-2 text-center">Welcome Back</h2>
        <p class="text-xs text-slate-500 text-center mb-6">Log in to view your private expenses</p>
        
        {% if error %}
        <div class="alert alert-error text-sm mb-4 py-2">{{ error }}</div>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="label text-xs font-medium text-slate-600">Username</label>
                <input type="text" name="username" class="input input-bordered w-full text-sm" required />
            </div>
            <div>
                <label class="label text-xs font-medium text-slate-600">Password</label>
                <input type="password" name="password" class="input input-bordered w-full text-sm" required />
            </div>
            <button type="submit" class="btn btn-primary w-full mt-2">Login</button>
        </form>
        <p class="text-xs text-center text-slate-500 mt-6">
            Don't have an account? <a href="/register" class="text-indigo-600 font-semibold hover:underline">Register here</a>
        </p>
    </div>
</body>
</html>
